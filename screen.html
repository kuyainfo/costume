<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>最佳造型獎 - 投影畫面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0b0804;--gold:#e8c565;--gold2:#b8862b;--txt:#f7f0dc;--sub:#a99a78;--line:rgba(212,175,55,.3);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{background:
  radial-gradient(70% 60% at 50% -10%,rgba(232,197,101,.22),transparent 62%),
  radial-gradient(50% 50% at 0% 110%,rgba(184,134,43,.18),transparent 60%),
  radial-gradient(50% 50% at 100% 110%,rgba(184,134,43,.18),transparent 60%),var(--bg)}
.hide{display:none!important}
.goldtxt{background:linear-gradient(180deg,#fff4c9 0%,#f0cf78 40%,#b8862b 70%,#f7dc90 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.silvertxt{background:linear-gradient(180deg,#ffffff 0%,#dfe3ea 40%,#8d95a3 72%,#eef1f5 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bronzetxt{background:linear-gradient(180deg,#ffe2c4 0%,#e3a46b 42%,#94592b 72%,#f0be8e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* 裝飾外框 */
.frameDeco{position:fixed;inset:1.4vh;border:1px solid var(--line);pointer-events:none;z-index:2}
.frameDeco::before{content:"";position:absolute;inset:.6vh;border:1px solid rgba(212,175,55,.12)}
.frameDeco i{position:absolute;width:1.4vh;height:1.4vh;transform:rotate(45deg);border:1px solid var(--gold);background:var(--bg)}
.frameDeco i:nth-child(1){left:-.75vh;top:-.75vh}.frameDeco i:nth-child(2){right:-.75vh;top:-.75vh}
.frameDeco i:nth-child(3){left:-.75vh;bottom:-.75vh}.frameDeco i:nth-child(4){right:-.75vh;bottom:-.75vh}
#spark{position:fixed;inset:0;pointer-events:none;z-index:0}
#spark b{position:absolute;width:.5vh;height:.5vh;border-radius:50%;background:#ffe9a8;
  box-shadow:0 0 1.2vh #f0cf78;opacity:0;animation:tw 4s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.85;transform:scale(1)}}

header{position:relative;z-index:3;height:15vh;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}
.brand .kick{font-size:1.4vh;letter-spacing:.8em;color:var(--gold);margin-bottom:1vh}
.brand h1{font-family:var(--serif);font-weight:900;font-size:6.2vh;letter-spacing:.16em;line-height:1.1}
.right{display:flex;align-items:center;gap:2.4vw}
.stat{text-align:right}
.stat .n{font-size:5vh;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:1.3vh;letter-spacing:.34em;color:var(--sub);margin-top:1vh}
.pill{display:flex;align-items:center;gap:.7vw;font-size:1.6vh;letter-spacing:.24em;padding:1vh 1.4vw;border-radius:99px;
  border:1px solid var(--line);color:var(--sub)}
.led{width:1.1vh;height:1.1vh;border-radius:50%;background:#777}
.pill.open .led{background:#3ad07a;box-shadow:0 0 1.4vh #3ad07a;animation:pulse 1.6s infinite}
.pill.open{color:#bff2d2;border-color:rgba(58,208,122,.45)}
.pill.closed .led{background:var(--gold)}
.pill.closed{color:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.qr{display:flex;align-items:center;gap:1vw}
.qr .box{background:#fff;padding:.6vh;border-radius:.8vh}
.qr .box img,.qr .box canvas{display:block;width:10vh!important;height:10vh!important}
.qr .t{font-size:1.4vh;letter-spacing:.3em;color:var(--gold);writing-mode:vertical-rl}

/* 照片牆 */
#wall{position:relative;z-index:3;height:85vh;padding:1vh 5vw 5vh;display:grid;justify-content:center;align-content:center}
.wc{width:var(--pw);display:flex;flex-direction:column;align-items:center;animation:fadeUp .6s both}
.wc .ph{position:relative;width:100%;aspect-ratio:3/4;padding:calc(var(--pw)*.025);border-radius:calc(var(--pw)*.05);
  background:linear-gradient(160deg,#f7dc90,#8a6420 45%,#f0cf78 70%,#7a561a)}
.wc .ph .in{width:100%;height:100%;border-radius:calc(var(--pw)*.035);overflow:hidden;background:#211a0e}
.wc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.wc .no{position:absolute;left:calc(var(--pw)*.06);top:calc(var(--pw)*.06);font-size:calc(var(--pw)*.075);font-weight:800;
  padding:.2em .55em;border-radius:99px;background:rgba(11,8,4,.75);color:var(--gold);border:1px solid rgba(232,197,101,.5);letter-spacing:.04em}
.wc .nm{margin-top:calc(var(--pw)*.06);font-size:calc(var(--pw)*.11);font-weight:800;letter-spacing:.04em;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.wc .s2{font-size:calc(var(--pw)*.068);color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
#wall.tight .s2{display:none}
.empty{font-size:3vh;color:var(--sub);letter-spacing:.2em}
@keyframes fadeUp{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}

/* 揭曉 */
#stage{position:relative;z-index:3;height:85vh;display:flex;align-items:center;justify-content:center;padding-bottom:4vh}
.rk{display:flex;align-items:center;gap:6vw}
.rkPh{position:relative;width:51vh;height:68vh;flex:none}
.rays{position:absolute;left:50%;top:50%;width:150vh;height:150vh;margin:-75vh 0 0 -75vh;border-radius:50%;
  background:repeating-conic-gradient(rgba(240,207,120,.13) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);mask:radial-gradient(circle,#000 0%,transparent 62%);
  animation:spin 40s linear infinite, raysIn 1.4s both;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
.gframe{width:100%;height:100%;padding:1.1vh;border-radius:2.2vh;
  background:linear-gradient(160deg,#fff0bd,#8a6420 40%,#f0cf78 65%,#7a561a);
  box-shadow:0 0 6vh rgba(240,207,120,.35);animation:popIn 1.1s cubic-bezier(.2,1.3,.4,1) both}
.gframe.silver{background:linear-gradient(160deg,#ffffff,#7f8794 40%,#e5e8ee 65%,#6d7380);box-shadow:0 0 6vh rgba(220,225,235,.25)}
.gframe.bronze{background:linear-gradient(160deg,#ffe0bf,#7e4a22 40%,#e3a46b 65%,#6b3d1a);box-shadow:0 0 6vh rgba(227,164,107,.28)}
.gframe .in{width:100%;height:100%;border-radius:1.4vh;overflow:hidden;background:#211a0e}
.gframe img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes popIn{0%{opacity:0;transform:scale(.6) rotate(-4deg);filter:blur(1.4vh)}100%{opacity:1;transform:none;filter:none}}
.rkInfo{max-width:52vw}
.rkInfo > *{animation:fadeUp .8s both}
.rkLbl{font-family:var(--serif);font-weight:900;font-size:13vh;letter-spacing:.1em;line-height:1.05;animation-delay:.5s!important}
.rkEn{font-size:2vh;letter-spacing:.8em;color:var(--sub);margin-top:1.2vh;animation-delay:.7s!important}
.rkDiv{width:24vh;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:4vh 0 3vh;animation-delay:.9s!important}
.rkNo{font-size:2.6vh;letter-spacing:.3em;color:var(--gold);animation-delay:1.1s!important}
.rkName{font-size:8vh;font-weight:900;letter-spacing:.04em;line-height:1.2;margin-top:.8vh;word-break:break-all;animation-delay:1.3s!important}
.rkF{font-size:2.8vh;color:var(--sub);margin-top:1.4vh;line-height:1.5;animation-delay:1.5s!important;word-break:break-all}
.rkF span{color:#7d6e4e;margin-right:1vw;font-size:2.2vh;letter-spacing:.14em}
.rkVotes{margin-top:3.4vh;font-size:3vh;color:var(--sub);letter-spacing:.2em;animation-delay:1.8s!important}
.rkVotes b{font-size:7vh;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:0;margin-right:.8vw}

.pod{display:flex;align-items:flex-end;justify-content:center;gap:4.5vw;height:100%;padding-top:2vh}
.pd{display:flex;flex-direction:column;align-items:center;animation:fadeUp .9s both}
.pd .gframe{width:var(--w);height:calc(var(--w)*4/3);padding:.9vh;border-radius:1.8vh}
.pd .lbl{font-family:var(--serif);font-weight:900;font-size:5vh;letter-spacing:.12em;margin-top:2.4vh;line-height:1.1}
.pd .nm{font-size:3.4vh;font-weight:800;margin-top:.8vh;max-width:calc(var(--w) + 4vw);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .s2{font-size:2vh;color:var(--sub);margin-top:.4vh;max-width:calc(var(--w) + 4vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd .v{font-size:2.2vh;color:var(--sub);letter-spacing:.16em;margin-top:.8vh}
.pd .v b{color:var(--gold);font-size:3.2vh;margin-right:.4vw}
.pd.p1{--w:44vh;animation-delay:.9s}.pd.p2{--w:34vh;animation-delay:.3s}.pd.p3{--w:34vh;animation-delay:.5s}
.pd.p1 .lbl{font-size:6.4vh}

#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="spark"></div>
<div class="frameDeco"><i></i><i></i><i></i><i></i></div>

<header>
  <div class="brand">
    <div class="kick" id="kicker">BEST COSTUME AWARD</div>
    <h1 class="goldtxt" id="title">最佳造型獎</h1>
  </div>
  <div class="right">
    <div class="stat"><div class="n goldtxt" id="nVoters">0</div><div class="l">投票人數</div></div>
    <div class="pill" id="pill"><span class="led"></span><span id="pillTxt">尚未開始</span></div>
    <div class="qr hide" id="qr"><div class="box" id="qrBox"></div><div class="t">掃碼投票</div></div>
  </div>
</header>

<div id="wall"></div>
<div id="stage" class="hide"></div>
<canvas id="fx"></canvas>

<script>
/* ===================== 設定區 ===================== */
const FB_CONFIG = {
  apiKey:            "AIzaSyDl_NqANwk_lsfEL5kOyC1RJi29DLvGPU8",
  authDomain:        "kuya-candy-game.firebaseapp.com",
  databaseURL:       "https://kuya-candy-game-default-rtdb.firebaseio.com",
  projectId:         "kuya-candy-game",
  storageBucket:     "kuya-candy-game.firebasestorage.app",
  messagingSenderId: "105923267148",
  appId:             "1:105923267148:web:1f0e0db9de8cc2876c42e9"
};
const ROOT = "costume";
/* 投票頁網址：留空＝自動抓同資料夾的投票頁（本機 costume_vote.html／GitHub 版 index.html） */
const VOTE_URL = "";
/* ================================================== */

firebase.initializeApp(FB_CONFIG);
const db = firebase.database();

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n==null?"":n).padStart(2,"0");

let cfg=null, cands=null, photos={}, votes={}, reveal={step:0};

/* 背景閃光 */
(function(){
  const sp=$("spark");
  for(let i=0;i<38;i++){
    const b=document.createElement("b");
    b.style.left=(Math.random()*100)+"vw"; b.style.top=(Math.random()*100)+"vh";
    b.style.animationDelay=(Math.random()*4)+"s"; b.style.animationDuration=(3+Math.random()*3)+"s";
    const s=.3+Math.random()*.6; b.style.width=b.style.height=s+"vh";
    sp.appendChild(b);
  }
})();

/* QR code */
(function(){
  /* 本機測試檔名為 costume_*.html；GitHub 正式版投票頁是 index.html（網址只到資料夾即可） */
  const LOCAL = /costume_[a-z]+\.html$/i.test(location.pathname);
  const url = VOTE_URL || location.href.split(/[?#]/)[0].replace(/[^\/]*$/, LOCAL?"costume_vote.html":"");
  try{ new QRCode($("qrBox"),{text:url,width:256,height:256,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ console.warn("QR 產生失敗",e); }
})();

function fieldsOf(){ const f=cfg&&cfg.fields; return (Array.isArray(f)?f:Object.values(f||{})).filter(Boolean); }
function list(){ return Object.keys(cands||{}).map(id=>Object.assign({id},cands[id])).sort((a,b)=>(+a.no||0)-(+b.no||0)); }
function mainTxt(c){ const f=fieldsOf(); return f[0]?((c.vals||{})[f[0].id]||""):""; }
function subTxt(c){ return fieldsOf().slice(1).map(f=>(c.vals||{})[f.id]).filter(v=>v).join("・"); }
function voterCount(){ const r=(cfg&&cfg.round)||1; return Object.values(votes||{}).filter(v=>v&&(v.r||1)===r).length; }

function paintHeader(){
  if(!cfg) return;
  $("title").textContent = cfg.title || "最佳造型獎";
  $("kicker").textContent = cfg.kicker || "";
  const st=cfg.status||"idle";
  $("pill").className="pill "+st;
  $("pillTxt").textContent = st==="open"?"投票進行中":st==="closed"?"投票已截止":"尚未開始";
  $("qr").classList.toggle("hide", st==="closed" || (reveal&&reveal.step>0));
  $("nVoters").textContent = voterCount().toLocaleString();
}

/* ---------- 照片牆 ---------- */
let wallKey="";
function paintWall(force){
  const arr=list();
  const key=JSON.stringify(arr)+"|"+Object.keys(photos).sort().join(",")+"|"+JSON.stringify(fieldsOf());
  if(!force && key===wallKey) return; wallKey=key;
  const w=$("wall");
  if(!arr.length){ w.style.gridTemplateColumns=""; w.innerHTML='<div class="empty">尚未建立候選人</div>'; return; }
  w.innerHTML = arr.map((c,i)=>
    '<div class="wc" style="animation-delay:'+(i*0.04)+'s"><div class="ph"><div class="in">'+
      (photos[c.id]?'<img src="'+photos[c.id]+'" alt="">':'')+
    '</div><span class="no">No.'+esc(pad(c.no))+'</span></div>'+
    '<div class="nm">'+esc(mainTxt(c))+'</div><div class="s2">'+esc(subTxt(c))+'</div></div>').join("");
  layoutWall();
}
function layoutWall(){
  const w=$("wall"), n=w.querySelectorAll(".wc").length; if(!n) return;
  const cs=getComputedStyle(w);
  const W=w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const gx=innerHeight*0.03, gy=innerHeight*0.025;
  const hasSub = fieldsOf().length>1;
  let best=null;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    const cw=(W-gx*(cols-1))/cols, ch=(H-gy*(rows-1))/rows;
    const ratio = 4/3 + 0.06 + 0.11*1.25 + (hasSub?0.068*1.35:0);   /* 照片 + 名字 + 副標 */
    const pw=Math.min(cw, ch/ratio);
    if(!best||pw>best.pw) best={cols,rows,pw};
  }
  let pw=best.pw;
  const tight = pw < innerHeight*0.17;           /* 格子太小時隱藏副標 */
  if(tight && hasSub){
    const rows=best.rows, ch=(H-gy*(rows-1))/rows, cw=(W-gx*(best.cols-1))/best.cols;
    pw=Math.min(cw, ch/(4/3+0.06+0.11*1.25));
  }
  pw=Math.min(pw, innerHeight*0.42);
  w.classList.toggle("tight", tight);
  w.style.setProperty("--pw", Math.floor(pw)+"px");
  w.style.gridTemplateColumns="repeat("+best.cols+","+Math.floor(pw)+"px)";
  w.style.columnGap=gx+"px"; w.style.rowGap=gy+"px";
}
addEventListener("resize",()=>{ layoutWall(); sizeFx(); });

/* ---------- 揭曉 ---------- */
const RANK = {
  1:{zh:"第一名",en:"FIRST PLACE",txt:"goldtxt",fr:""},
  2:{zh:"第二名",en:"SECOND PLACE",txt:"silvertxt",fr:"silver"},
  3:{zh:"第三名",en:"THIRD PLACE",txt:"bronzetxt",fr:"bronze"}
};
function normTop(t){ return (Array.isArray(t)?t:Object.values(t||{})).filter(Boolean); }
let stageKey="";
function paintStage(){
  const top=normTop(reveal&&reveal.top), k=top.length, step=(reveal&&reveal.step)||0;
  if(!step||!k||!cands){
    if(stageKey!==""){ stageKey=""; $("stage").classList.add("hide"); $("stage").innerHTML=""; $("wall").classList.remove("hide"); paintWall(true); }
    return;
  }
  const ids=top.map(x=>x.id);
  const key=step+"|"+JSON.stringify(top)+"|"+ids.map(id=>(photos[id]?1:0)+(cands[id]?JSON.stringify(cands[id].vals):"")).join(",")+"|"+(cfg&&cfg.showVotes!==false);
  if(key===stageKey) return; stageKey=key;
  $("wall").classList.add("hide"); $("stage").classList.remove("hide");
  const showVotes = !cfg || cfg.showVotes!==false;
  if(step<=k){
    const rank=k-step+1, it=top[rank-1], c=cands[it.id]||{vals:{}}, R=RANK[rank]||RANK[3];
    const rest=fieldsOf().slice(1).filter(f=>(c.vals||{})[f.id]);
    $("stage").innerHTML =
      '<div class="rk"><div class="rkPh"><div class="rays"></div><div class="gframe '+R.fr+'"><div class="in">'+
        (photos[it.id]?'<img src="'+photos[it.id]+'" alt="">':'')+'</div></div></div>'+
      '<div class="rkInfo">'+
        '<div class="rkLbl '+R.txt+'">'+R.zh+'</div><div class="rkEn">'+R.en+'</div><div class="rkDiv"></div>'+
        '<div class="rkNo">No.'+esc(pad(c.no))+'</div>'+
        '<div class="rkName">'+esc(mainTxt(c))+'</div>'+
        rest.map(f=>'<div class="rkF"><span>'+esc(f.label)+'</span>'+esc(c.vals[f.id])+'</div>').join("")+
        (showVotes?'<div class="rkVotes"><b id="cnt">0</b>票</div>':'')+
      '</div></div>';
    if(showVotes) setTimeout(()=>countUp($("cnt"),it.v||0),1800);
    confetti(rank===1?260:rank===2?110:70, rank===1?1300:900);
  }else{
    const order=[2,1,3].filter(r=>r<=k);
    $("stage").innerHTML='<div class="pod">'+order.map(r=>{
      const it=top[r-1], c=cands[it.id]||{vals:{}}, R=RANK[r];
      return '<div class="pd p'+r+'"><div class="gframe '+R.fr+'"><div class="in">'+(photos[it.id]?'<img src="'+photos[it.id]+'" alt="">':'')+'</div></div>'+
        '<div class="lbl '+R.txt+'">'+R.zh+'</div>'+
        '<div class="nm">No.'+esc(pad(c.no))+'　'+esc(mainTxt(c))+'</div>'+
        '<div class="s2">'+esc(subTxt(c))+'</div>'+
        (showVotes?'<div class="v"><b>'+(it.v||0).toLocaleString()+'</b>票</div>':'')+'</div>';
    }).join("")+'</div>';
    confetti(320,1600);
  }
  paintHeader();
}
function countUp(el,to){
  if(!el) return; const dur=1400, t0=performance.now();
  (function f(now){ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e).toLocaleString(); if(p<1) requestAnimationFrame(f); })(t0);
}

/* ---------- 彩帶 ---------- */
const fx=$("fx"), fc=fx.getContext("2d"); let parts=[], fxOn=false;
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
sizeFx();
const COLORS=["#f7dc90","#e8c565","#b8862b","#fff4c9","#d9a441","#ffffff"];
function confetti(n,delay){
  setTimeout(()=>{
    for(let i=0;i<n;i++){
      const fromLeft=i%2===0;
      parts.push({x:fromLeft?-10:fx.width+10, y:fx.height*(.55+Math.random()*.35),
        vx:(fromLeft?1:-1)*(6+Math.random()*12)*fx.height/1000, vy:-(10+Math.random()*14)*fx.height/1000,
        s:(5+Math.random()*7)*fx.height/1000, r:Math.random()*6, vr:(Math.random()-.5)*.3,
        c:COLORS[(Math.random()*COLORS.length)|0], life:0});
    }
    if(!fxOn){ fxOn=true; requestAnimationFrame(tick); }
  },delay||0);
}
function tick(){
  fc.clearRect(0,0,fx.width,fx.height);
  const g=0.28*fx.height/1000;
  parts=parts.filter(p=>p.y<fx.height+40 && p.life<600);
  parts.forEach(p=>{
    p.vy+=g; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    fc.save(); fc.translate(p.x,p.y); fc.rotate(p.r); fc.scale(1,Math.cos(p.life*.18));
    fc.fillStyle=p.c; fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fc.restore();
  });
  if(parts.length) requestAnimationFrame(tick); else { fxOn=false; fc.clearRect(0,0,fx.width,fx.height); }
}

function paintAll(){ paintHeader(); if(!(reveal&&reveal.step>0)) paintWall(); paintStage(); }

db.ref(ROOT+"/config").on("value", s=>{ cfg=s.val()||{status:"idle",round:1,fields:[{id:"f1",label:"姓名"}]}; paintAll(); });
db.ref(ROOT+"/cands").on("value", s=>{ cands=s.val()||{}; paintAll(); });
db.ref(ROOT+"/photos").on("value", s=>{ photos=s.val()||{}; paintAll(); });
db.ref(ROOT+"/votes").on("value", s=>{ votes=s.val()||{}; paintHeader(); });
db.ref(ROOT+"/reveal").on("value", s=>{ reveal=s.val()||{step:0}; paintAll(); });
</script>
